services:
  db:
    image: mongo:7
    container_name: the_clubs_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: the_clubs
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: the_clubs_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SECRET_KEY: ${SECRET_KEY:-the_clubs_production_secret_key_2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-the_clubs_production_jwt_key_2026}
      MONGODB_URI: mongodb://db:27017/the_clubs
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: the_clubs_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
